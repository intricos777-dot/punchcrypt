[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "punchcrypt"
version = "1.0.0"
description = "Encrypt data onto IBM 80-column punched cards"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Living_Sin", email = "intricos777-dot@users.noreply.github.com" }]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
punchcrypt = "punchcrypt.cli:main"

[tool.setuptools]
packages = ["punchcrypt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
